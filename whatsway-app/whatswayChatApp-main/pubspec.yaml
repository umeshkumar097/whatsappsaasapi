name: waki
description: "Waki — WhatsApp Marketing Platform by Aiclex"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.6.0
  http_parser: ^4.1.0
  url_launcher: ^6.3.2
  shared_preferences: ^2.5.5
  intl: ^0.20.3
  get: ^4.7.3
  connectivity_plus: ^7.3.1
  toastification: ^3.2.0
  cached_network_image: ^3.4.1
  google_fonts: ^8.2.0
  skeletonizer: ^2.1.3
  sizer: ^3.1.3
  socket_io_client: ^3.1.6
  web_socket_channel: ^3.0.3
  firebase_core: ^4.12.1
  firebase_messaging: ^16.4.3
  flutter_local_notifications: ^22.2.0
  pinput: ^6.0.2
  image_picker: ^1.2.3
  flutter_contacts: ^2.1.0
  permission_handler: ^12.0.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

